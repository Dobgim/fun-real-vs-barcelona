services:
  - type: web
    name: barcelonavsrealmadridfans-api
    runtime: node
    plan: free
    # Builds the API and the website; the server serves both, so the Render URL is a complete site.
    buildCommand: npm install --include=dev && npm run build -w server && VITE_API_URL= npm run build -w client
    startCommand: npm start -w server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "20"
      - key: ADMIN_KEY
        generateValue: true
      - key: CLIENT_ORIGIN
        value: https://*.vercel.app
